<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="0.55" stop-color="#f29560"/>
      <stop offset="1" stop-color="#8b1e3f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8a3a"/>
      <stop offset="1" stop-color="#2f5022"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffce6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="1100" cy="300" r="160" fill="url(#sun)"/>
  <circle cx="1100" cy="300" r="80" fill="#fff3c0"/>

  <!-- Distant hills -->
  <path d="M0 620 Q 250 540 500 600 Q 800 660 1100 580 Q 1350 540 1600 600 L 1600 900 L 0 900 Z" fill="#3a2240" opacity="0.55"/>
  <!-- Closer hills -->
  <path d="M0 700 Q 300 640 600 700 Q 900 760 1200 690 Q 1450 640 1600 700 L 1600 900 L 0 900 Z" fill="#4a1a3a" opacity="0.7"/>
  <!-- Ground -->
  <rect x="0" y="760" width="1600" height="140" fill="url(#ground)"/>
  <!-- Grass blades -->
  <g stroke="#2d4a1a" stroke-width="2" fill="none" opacity="0.5">
    <path d="M40 770 v-12"/><path d="M120 770 v-14"/><path d="M210 770 v-12"/><path d="M280 770 v-15"/>
    <path d="M380 770 v-10"/><path d="M460 770 v-13"/><path d="M540 770 v-12"/><path d="M620 770 v-14"/>
    <path d="M1080 770 v-12"/><path d="M1180 770 v-14"/><path d="M1280 770 v-12"/><path d="M1380 770 v-15"/>
    <path d="M1480 770 v-10"/><path d="M1560 770 v-13"/>
  </g>

  <!-- LEFT: Mango tree -->
  <!-- Trunk -->
  <path d="M250 760 Q 240 600 270 460 Q 290 380 280 320" stroke="#5c3a1c" stroke-width="42" fill="none" stroke-linecap="round"/>
  <!-- Branches -->
  <path d="M275 470 Q 200 440 160 380" stroke="#5c3a1c" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M280 420 Q 360 390 410 340" stroke="#5c3a1c" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Foliage clusters -->
  <ellipse cx="200" cy="290" rx="160" ry="120" fill="#2f6b2a"/>
  <ellipse cx="320" cy="240" rx="150" ry="115" fill="#3a8035"/>
  <ellipse cx="430" cy="290" rx="130" ry="100" fill="#2f6b2a"/>
  <ellipse cx="270" cy="370" rx="140" ry="80" fill="#3a8035"/>
  <!-- Mangoes hanging -->
  <g>
    <ellipse cx="180" cy="380" rx="22" ry="28" fill="#f5a524"/>
    <ellipse cx="178" cy="376" rx="10" ry="14" fill="#fac26b" opacity="0.7"/>
    <line x1="180" y1="354" x2="180" y2="346" stroke="#5c3a1c" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="245" cy="410" rx="22" ry="28" fill="#f5a524"/>
    <ellipse cx="243" cy="406" rx="10" ry="14" fill="#fac26b" opacity="0.7"/>
    <line x1="245" y1="384" x2="245" y2="376" stroke="#5c3a1c" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="345" cy="395" rx="22" ry="28" fill="#e88a14"/>
    <ellipse cx="343" cy="391" rx="10" ry="14" fill="#fac26b" opacity="0.7"/>
    <line x1="345" y1="369" x2="345" y2="361" stroke="#5c3a1c" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="410" cy="380" rx="22" ry="28" fill="#f5a524"/>
    <ellipse cx="408" cy="376" rx="10" ry="14" fill="#fac26b" opacity="0.7"/>
    <line x1="410" y1="354" x2="410" y2="346" stroke="#5c3a1c" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="490" cy="350" rx="22" ry="28" fill="#e88a14"/>
    <ellipse cx="488" cy="346" rx="10" ry="14" fill="#fac26b" opacity="0.7"/>
    <line x1="490" y1="324" x2="490" y2="316" stroke="#5c3a1c" stroke-width="2"/>
  </g>

  <!-- RIGHT: Litchi tree branch -->
  <path d="M1450 760 Q 1430 580 1380 440 Q 1340 360 1290 320" stroke="#5c3a1c" stroke-width="38" fill="none" stroke-linecap="round"/>
  <path d="M1380 440 Q 1280 420 1220 360" stroke="#5c3a1c" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="1310" cy="260" rx="150" ry="110" fill="#2f6b2a"/>
  <ellipse cx="1430" cy="220" rx="130" ry="105" fill="#3a8035"/>
  <ellipse cx="1490" cy="320" rx="120" ry="95" fill="#2f6b2a"/>
  <!-- Litchi clusters (red small fruits) -->
  <g fill="#c93b66">
    <circle cx="1240" cy="380" r="14"/><circle cx="1262" cy="386" r="14"/><circle cx="1252" cy="404" r="14"/>
    <circle cx="1330" cy="395" r="14"/><circle cx="1350" cy="402" r="14"/><circle cx="1342" cy="420" r="14"/>
    <circle cx="1430" cy="370" r="14"/><circle cx="1452" cy="378" r="14"/><circle cx="1442" cy="395" r="14"/>
  </g>
  <g fill="#7a1f3a" opacity="0.6">
    <circle cx="1240" cy="380" r="6"/><circle cx="1262" cy="386" r="6"/><circle cx="1252" cy="404" r="6"/>
    <circle cx="1330" cy="395" r="6"/><circle cx="1350" cy="402" r="6"/><circle cx="1342" cy="420" r="6"/>
    <circle cx="1430" cy="370" r="6"/><circle cx="1452" cy="378" r="6"/><circle cx="1442" cy="395" r="6"/>
  </g>

  <!-- MAN — center/right of frame, picking a mango -->
  <g id="man">
    <!-- Shadow -->
    <ellipse cx="780" cy="820" rx="120" ry="14" fill="#1a0a18" opacity="0.35"/>

    <!-- Legs -->
    <rect x="730" y="660" width="36" height="160" rx="14" fill="#3b2e6e"/>
    <rect x="790" y="660" width="36" height="160" rx="14" fill="#3b2e6e"/>
    <!-- Shoes -->
    <ellipse cx="748" cy="822" rx="26" ry="10" fill="#1f1740"/>
    <ellipse cx="808" cy="822" rx="26" ry="10" fill="#1f1740"/>

    <!-- Torso (t-shirt) -->
    <path d="M700 470 Q 700 460 720 458 L 836 458 Q 856 460 856 470 L 856 670 Q 856 680 846 680 L 710 680 Q 700 680 700 670 Z" fill="#f5a524"/>
    <!-- T-shirt collar -->
    <path d="M758 458 Q 778 478 800 458" fill="none" stroke="#c97f15" stroke-width="3"/>
    <!-- T-shirt text "MangoBerryEstate" -->
    <text x="778" y="572" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700" fill="#5c1f29">MangoBerry</text>
    <text x="778" y="600" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700" fill="#5c1f29">Estate</text>

    <!-- Right arm reaching up to mango (image-right, character left) -->
    <path d="M708 480 Q 660 380 600 320" stroke="#c98864" stroke-width="34" fill="none" stroke-linecap="round"/>
    <!-- Left arm holding basket -->
    <path d="M848 478 Q 880 540 870 620" stroke="#c98864" stroke-width="34" fill="none" stroke-linecap="round"/>
    <!-- Right hand (touching mango) -->
    <circle cx="600" cy="320" r="22" fill="#c98864"/>
    <!-- Left hand on basket -->
    <circle cx="868" cy="630" r="20" fill="#c98864"/>

    <!-- Head -->
    <ellipse cx="778" cy="410" rx="62" ry="68" fill="#d99770"/>
    <!-- Hair -->
    <path d="M720 380 Q 740 332 778 332 Q 818 332 838 382 Q 824 360 798 360 Q 778 360 762 372 Q 744 380 720 380 Z" fill="#2c1a0e"/>
    <!-- Eyes -->
    <circle cx="758" cy="408" r="4" fill="#2c1a0e"/>
    <circle cx="798" cy="408" r="4" fill="#2c1a0e"/>
    <!-- Smile -->
    <path d="M762 442 Q 778 452 794 442" stroke="#2c1a0e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="746" cy="430" r="6" fill="#e9a283" opacity="0.7"/>
    <circle cx="810" cy="430" r="6" fill="#e9a283" opacity="0.7"/>

    <!-- Mango being picked (just above his right hand, freshly plucked) -->
    <ellipse cx="582" cy="298" rx="20" ry="25" fill="#f5a524"/>
    <ellipse cx="580" cy="294" rx="9" ry="13" fill="#fac26b" opacity="0.7"/>

    <!-- Basket -->
    <path d="M780 640 Q 780 632 790 632 L 950 632 Q 960 632 960 640 L 950 740 Q 950 748 942 748 L 798 748 Q 790 748 790 740 Z" fill="#a85a1f"/>
    <path d="M780 640 L 960 640" stroke="#7a3a12" stroke-width="3"/>
    <!-- Basket weave lines -->
    <path d="M790 660 L 950 660 M790 680 L 950 680 M790 700 L 950 700 M790 720 L 950 720" stroke="#7a3a12" stroke-width="2" opacity="0.6"/>
    <path d="M820 640 L 820 745 M860 640 L 860 745 M900 640 L 900 745 M930 640 L 930 745" stroke="#7a3a12" stroke-width="2" opacity="0.4"/>
    <!-- Mangoes in basket -->
    <ellipse cx="830" cy="650" rx="20" ry="22" fill="#f5a524"/>
    <ellipse cx="870" cy="648" rx="20" ry="22" fill="#e88a14"/>
    <ellipse cx="910" cy="652" rx="20" ry="22" fill="#f5a524"/>
    <!-- Litchis in basket -->
    <circle cx="850" cy="680" r="14" fill="#c93b66"/>
    <circle cx="880" cy="678" r="14" fill="#c93b66"/>
    <circle cx="900" cy="688" r="14" fill="#c93b66"/>
  </g>

  <!-- A few flying birds for atmosphere -->
  <g stroke="#3a2240" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M540 180 q 10 -10 20 0 q 10 -10 20 0"/>
    <path d="M620 140 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M900 200 q 9 -9 18 0 q 9 -9 18 0"/>
  </g>
</svg>
